server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirect with relative Location headers: behind the proxy this container
    # sees plain http on port 80, which must not leak into redirects.
    absolute_redirect off;

    # One canonical host. (Cloudflare can do this too; this covers direct hits.)
    if ($host = www.gymmatehub.com) {
        return 301 https://gymmatehub.com$request_uri;
    }

    # Gzip settings
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/json application/xml application/manifest+json image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Old marketing URL
    location = /services {
        return 301 /features;
    }

    # One URL per page: drop trailing slashes (except the root).
    rewrite ^/(.+)/$ /$1 permanent;

    # Marketing pages are prerendered to <page>.html (scripts/prerender.mjs).
    # Everything else is the SPA shell, app.html, which is marked noindex.
    location = / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri.html /app.html;
        add_header Cache-Control "no-cache";
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
    }

    # Vite's hashed bundles never change, so cache them for good. A missing
    # chunk is a real 404, not the app shell.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
